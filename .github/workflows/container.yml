name: Container

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve build metadata
        id: build_meta
        run: |
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nodeknit'
          always-auth: true

      # local_modules/* are git submodules that publish to npm.pkg.github.com under a
      # "commit" dist-tag on every push. The Docker build rewrites the @nodeknit/* deps from
      # file:./local_modules/* to "commit" and resolves them from the registry, so that tag
      # must point at the submodule commits this superproject currently pins.
      # `git submodule status` reads the recorded gitlink SHA from the index, so the
      # submodules do not need to be checked out.
      - name: Ensure commit dist-tags point to pinned submodule versions
        id: nodeknit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          # Base versions come from each submodule's package.json; the publish CI appends
          # `-commit.<shortSha>`. Keep this map in sync with those "version" fields.
          declare -A base=(
            [app-adminizer]=1.0.0
            [app-graphql]=1.0.0
            [app-manager]=1.0.0
            [app-mcp]=1.0.0
            [app-telegram-bot]=1.0.0
            [app-workflow]=0.1.0
          )
          versions=""
          # Sorted, so the same pins always produce the same string — this is a Docker cache key
          # (NODEKNIT_COMMIT_VERSIONS below), and an unstable order would rebuild node_modules on
          # every push while a stale order would keep serving them.
          for pkg in $(printf '%s\n' "${!base[@]}" | sort); do
            sha=$(git submodule status -- "local_modules/$pkg" | awk '{print $1}' | sed 's/^[-+U]//' | cut -c1-7)
            version="${base[$pkg]}-commit.${sha}"
            echo "Tagging @nodeknit/${pkg}@${version} as commit"
            npm dist-tag add "@nodeknit/${pkg}@${version}" commit --registry=https://npm.pkg.github.com || true
            versions="${versions}@nodeknit/${pkg}@${version} "
          done
          echo "versions=${versions% }" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.build_meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            NODEKNIT_COMMIT_VERSIONS=${{ steps.nodeknit.outputs.versions }}
          secrets: |
            github_npm_token=${{ secrets.GH_PAT || github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
