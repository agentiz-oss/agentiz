services:
  agentiz:
    image: agentiz:latest
    env_file:
      - .env
    ports:
      - "17280:17280"
    volumes:
      - ./data:/app/data
    environment:
      DB_DIALECT: postgres
    labels:
      - com.centurylinklabs.watchtower.enable=true

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
